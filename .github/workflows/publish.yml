name: Publish npm release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed package version (for example 1.0.0-rc.1)
        required: true
        type: string
      sha512:
        description: SHA-512 hex digest of the reviewed npm tarball
        required: true
        type: string
      publish:
        description: Publish the verified tarball to the public npm rc tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-npm-rc
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      SHA512: ${{ inputs.sha512 }}
    steps:
      - name: Download and verify the reviewed release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]
          [[ "$SHA512" =~ ^[0-9a-f]{128}$ ]]
          file="svt-project-svt-js-$VERSION.tgz"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$file"
          mv "$file" candidate.tgz
          printf '%s  candidate.tgz\n' "$SHA512" | sha512sum --check --strict
          tar -xOzf candidate.tgz package/package.json | jq -e --arg v "$VERSION" '
            .name == "@svt-project/svt-js" and .version == $v and .private != true
            and .publishConfig.access == "public" and .publishConfig.tag == "rc"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-candidate
          path: candidate.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-candidate
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Publish the exact tarball with npm provenance
        env:
          SHA512: ${{ inputs.sha512 }}
        run: |
          set -euo pipefail
          printf '%s  candidate.tgz\n' "$SHA512" | sha512sum --check --strict
          npm publish ./candidate.tgz --registry=https://registry.npmjs.org --access public --tag rc --provenance --ignore-scripts
